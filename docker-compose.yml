version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: nawi-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nawi_metrology
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nawi-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/nawi_metrology
      JWT_SECRET: super_secure_production_jwt_secret_key_min_32_chars_long!
      REPORT_INTEGRITY_SECRET: super_secure_report_integrity_hmac_secret_min_32_chars!
      CLIENT_ORIGIN: http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nawi-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
